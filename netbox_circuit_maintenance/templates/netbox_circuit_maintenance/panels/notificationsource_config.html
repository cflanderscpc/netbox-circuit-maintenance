{% extends "ui/panels/_base.html" %}
{% load i18n %}

{% block panel_content %}
  <table class="table table-hover attr-table">
    <tr>
      <th scope="row">{% trans "Type" %}</th>
      <td>{{ source_type|placeholder }}</td>
    </tr>
    <tr>
      <th scope="row">{% trans "Account ID" %}</th>
      <td>{{ account|placeholder }}</td>
    </tr>
    {% if error %}
      <tr>
        <th scope="row">{% trans "Authentication status" %}</th>
        <td class="text-danger">{{ error|linebreaksbr }}</td>
      </tr>
    {% endif %}
  </table>
{% endblock panel_content %}
